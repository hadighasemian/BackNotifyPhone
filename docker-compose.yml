name: phonenotify

services:
  phonenotify-backend:
    build:
      context: ./docker
      dockerfile: backend.Dockerfile
    image: phonenotify-backend:latest
    container_name: phonenotify-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Back:/var/www/html
      - phonenotify-storage:/var/www/html/storage/app
    networks:
      - phonenotify-network
      - shared-network

  phonenotify-backend-nginx:
    image: nginx:1.27-alpine
    container_name: phonenotify-backend-nginx
    restart: unless-stopped
    depends_on:
      - phonenotify-backend
    ports:
      - "127.0.0.1:3211:80"
    volumes:
      - ./Back/public:/var/www/html/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - phonenotify-network

networks:
  phonenotify-network:
    name: phonenotify-network
  shared-network:
    external: true
    name: shared-network

volumes:
  phonenotify-storage:
    name: phonenotify-storage
